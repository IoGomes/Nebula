<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <title>Nebula Call</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
    <style>
        body { background-color: #202124; color: white; overflow: hidden; }
        #videos { position: relative; height: 80vh; width: 100%; display: flex; justify-content: center; align-items: center; }
        .video-player { background-color: black; border-radius: 10px; object-fit: cover; }
        #remote-video { width: 100%; height: 100%; max-height: 80vh; }
        #video-wrapper { position: absolute; bottom: 20px; right: 20px; width: 120px; height: 160px; z-index: 10; border: 2px solid white; border-radius: 10px; overflow: hidden; }
        #local-video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .controls { position: fixed; bottom: 20px; left: 20px; z-index: 20; display: flex; gap: 10px; }
        #waiting { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5; }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div id="videos">
            <div id="waiting" class="btn btn-warning">Aguardando resposta...</div>
            <div id="video-wrapper">
                <video class="video-player" id="local-video" autoplay playsinline muted></video>
            </div>
            <video class="video-player" id="remote-video" autoplay playsinline></video>
        </div>

        <div class="controls">
            <div id="user-name" class="badge bg-secondary mb-2 d-block"></div>
            <button id="call" class="btn btn-success">Ligar</button>
            <button id="hangup" class="btn btn-danger" disabled>Desligar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
