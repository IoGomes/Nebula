<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>WebRTC Call</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <style>
        .video {
            width: 100%;
            height: auto;
            background-color: #333;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .buttons button {
            width: 100%;
        }
    </style>
</head>

<body>
<div class="container mt-3">
    <div class="row">
        <div class="buttons col-md-4 col-12">
            <h5 id="status-text">Disconnected</h5>

            <div class="card p-2 mb-3">
                <strong>Call Controls</strong>
                <button id="btn-call" class="btn btn-success d-block mb-1">Ligar para Target</button>
                <button id="share" class="btn btn-primary d-block mb-1">Start Camera</button>
            </div>

            <div class="card p-2 mb-3">
                <strong>Media Settings</strong>
                <button id="show-video" class="btn btn-secondary d-block mb-1">Show My Video</button>
                <button id="stop-video" class="btn btn-secondary d-block mb-1">Stop My Video</button>
                <button id="share-screen" class="btn btn-secondary d-block mb-1">Share Screen</button>
            </div>

            <div class="card p-2 mb-3">
                <strong>Devices</strong>
                <div class="mb-2">
                    <label>Mic:</label>
                    <select id="audio-input" class="form-select"></select>
                </div>
                <div class="mb-2">
                    <label>Speaker:</label>
                    <select id="audio-output" class="form-select"></select>
                </div>
                <div class="mb-2">
                    <label>Camera:</label>
                    <select id="video-input" class="form-select"></select>
                </div>
            </div>

            <div class="card p-2 mb-3">
                <strong>Recording</strong>
                <button id="start-record" class="btn btn-secondary mb-1">Start recording</button>
                <button id="stop-record" class="btn btn-secondary mb-1">Stop Recording</button>
                <button id="play-record" class="btn btn-secondary mb-1">Play Recording</button>
            </div>
        </div>

        <div class="videos col-md-8 col-12">
            <div>
                <h3>My feed</h3>
                <video id="my-video" class="video" autoplay playsinline muted></video>
            </div>
            <div>
                <h3>Their feed</h3>
                <video id="other-video" class="video" autoplay playsinline></video>
            </div>
        </div>
    </div>
</div>

<script>
    // --- 1. CONFIGURAÇÃO INICIAL E VARIÁVEIS GLOBAIS ---

    // Variáveis do DOM
    const videoEl = document.querySelector('#my-video'); // Definindo o vídeo local
    const remoteVideoEl = document.querySelector('#other-video'); // Definindo o vídeo remoto
    const statusText = document.querySelector('#status-text');

    // Socket URL (Ajuste conforme necessário. No emulador Android use 10.0.2.2 se for local)
    const SOCKET_URL = 'https://youlanda-undependable-compressingly.ngrok-free.dev';

    // Ler parâmetros da URL vindos do Android
    const urlParams = new URLSearchParams(window.location.search);
    const myUserId = urlParams.get('userId') || "13"; // Fallback para testes
    const myUserName = urlParams.get('userName') || "UserAndroid";
    let targetUserId = urlParams.get('targetId') || "15";

    let socket = null;
    let localStream = null; // Variável correta para o stream
    let peerConnection = null;
    let mediaRecorder;
    let recordedBlobs;

    const iceServers = {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' }
        ]
    };

    const constraints = {
        audio: true,
        video: true
    };

    // --- 2. FUNÇÕES SOCKET.IO E WEBRTC ---

    const initSocket = () => {
        socket = io(SOCKET_URL, {
            query: {
                userId: myUserId,
                userName: myUserName
            }
        });

        socket.on('connect', () => {
            console.log("Conectado ao Socket Server");
            statusText.innerHTML = "Online: " + myUserName;
            statusText.style.color = "green";
        });

        // Listener: Usuário alvo está online?
        socket.on('user-is-online', ({ isOnline }) => {
            if (isOnline) {
                startWebRTCOffer();
            } else {
                alert("Usuário " + targetUserId + " está offline.");
            }
        });

        // Listener: Recebendo Chamada (Oferta)
        socket.on('offerResponse', async (offer) => {
            console.log("Recebendo oferta de " + offer.offererUserName);
            targetUserId = offer.offererUserId; // Atualiza quem está ligando

            await createPeerConnection();
            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));

            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            socket.emit('newAnswer', {
                targetUserId: targetUserId,
                sdp: answer.sdp,
                type: answer.type
            });
        });

        // Listener: Recebendo Resposta (Answer)
        socket.on('answerResponse', async (answer) => {
            console.log("Chamada atendida!");
            await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
        });

        // Listener: ICE Candidates
        socket.on('receivedIceCandidate', async ({ candidate }) => {
            try {
                if(peerConnection) {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
                }
            } catch (e) {
                console.error('Erro ao adicionar ICE', e);
            }
        });
    }

    const makeCall = () => {
        if(!localStream) {
            alert("Inicie a câmera primeiro!");
            return getMicAndCamera().then(() => {
                socket.emit('check-user-online', targetUserId);
            });
        }
        socket.emit('check-user-online', targetUserId);
    }

    const startWebRTCOffer = async () => {
        await createPeerConnection();
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        socket.emit('newOffer', {
            targetUserId: targetUserId,
            sdp: offer.sdp,
            type: offer.type
        });
        console.log("Oferta enviada...");
    }

    const createPeerConnection = async () => {
        peerConnection = new RTCPeerConnection(iceServers);

        // Adiciona tracks locais ao peer connection
        if (localStream) {
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });
        }

        // Quando receber vídeo remoto
        peerConnection.ontrack = (event) => {
            console.log("Stream remoto recebido");
            remoteVideoEl.srcObject = event.streams[0];
        };

        // Enviar ICE Candidates locais para o servidor
        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                socket.emit('sendIceCandidate', {
                    targetUserId: targetUserId,
                    candidate: event.candidate
                });
            }
        };
    }


    // --- 3. FUNÇÕES DE MÍDIA LOCAL (Suas funções originais corrigidas) ---

    const getMicAndCamera = async (e) => {
        try {
            localStream = await navigator.mediaDevices.getUserMedia(constraints);
            showMyFeed();
            changeButtons(['green', 'blue', 'blue', 'grey', 'grey', 'grey', 'grey', 'grey']);

            // Se já existir conexão, adiciona a track
            if(peerConnection) {
               localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }

        } catch (err) {
            console.error("Erro getUserMedia:", err);
            alert("Erro ao acessar câmera. Verifique permissões.");
        }
    }

    const showMyFeed = () => {
        if(localStream) {
            videoEl.srcObject = localStream;
            changeButtons(['blue', 'grey', 'grey', 'blue', 'grey', 'grey', 'grey', 'grey']);
        }
    }

    const stopMyFeed = () => {
        if (localStream) {
            const tracks = localStream.getTracks();
            tracks.forEach(track => track.stop());
            videoEl.srcObject = null;
        }
    }

    // --- 4. LÓGICA DE GRAVAÇÃO (Mantida conforme original) ---

    const startRecording = () => {
        if (!localStream) return alert("No current feed");
        recordedBlobs = [];
        mediaRecorder = new MediaRecorder(localStream);
        mediaRecorder.ondataavailable = e => {
            if (e.data && e.data.size > 0) {
                recordedBlobs.push(e.data);
            }
        };
        mediaRecorder.start();
        console.log("Recording started");
    }

    const stopRecording = () => {
        if (!mediaRecorder) return alert("Please record before stopping!");
        mediaRecorder.stop();
        console.log("Recording stopped");
    }

    const playRecording = () => {
        if (!recordedBlobs || recordedBlobs.length === 0) return alert("No Recording saved");
        const superBuffer = new Blob(recordedBlobs, {type: 'video/webm'});
        remoteVideoEl.src = window.URL.createObjectURL(superBuffer);
        remoteVideoEl.controls = true;
        remoteVideoEl.play();
    }

    const shareScreen = async () => {
        try {
            const mediaStream = await navigator.mediaDevices.getDisplayMedia({video: true});
            videoEl.srcObject = mediaStream;
            // Atualiza a track enviada se estiver em chamada (avançado)
            // Aqui apenas mostra localmente por enquanto
        } catch (err) {
            console.log(err);
        }
    }

    // --- 5. SELEÇÃO DE DISPOSITIVOS ---

    const audioInputEl = document.querySelector("#audio-input");
    const audioOutputEl = document.querySelector("#audio-output");
    const videoInputEl = document.querySelector("#video-input");

    const getDevices = async () => {
        try {
            // Pede permissão primeiro para listar labels
            await navigator.mediaDevices.getUserMedia({audio: true, video: true});
            const devices = await navigator.mediaDevices.enumerateDevices();

            devices.forEach(d => {
                const option = document.createElement('option');
                option.value = d.deviceId;
                option.text = d.label || `Device ${d.deviceId}`;
                if (d.kind === "audioinput") audioInputEl.appendChild(option);
                if (d.kind === "audiooutput") audioOutputEl.appendChild(option);
                if (d.kind === "videoinput") videoInputEl.appendChild(option);
            });
        } catch (err) {
            console.log("Erro ao listar dispositivos", err);
        }
    }

    // --- 6. HELPERS VISUAIS ---

    const buttonsById = ['share', 'show-video', 'stop-video', 'start-record', 'stop-record', 'play-record', 'share-screen'];
    const buttonEls = buttonsById.map(id => document.getElementById(id));

    const changeButtons = (colorsArray) => {
        // Lógica simplificada para exemplo
        // Você pode manter sua lógica original de cores aqui
    }

    // --- EVENT LISTENERS ---

    document.querySelector("#btn-call").addEventListener('click', makeCall);
    document.querySelector("#share").addEventListener('click', getMicAndCamera);
    document.querySelector("#show-video").addEventListener('click', showMyFeed);
    document.querySelector("#stop-video").addEventListener('click', stopMyFeed);
    document.querySelector("#start-record").addEventListener('click', startRecording);
    document.querySelector("#stop-record").addEventListener('click', stopRecording);
    document.querySelector("#play-record").addEventListener('click', playRecording);
    document.querySelector("#share-screen").addEventListener('click', shareScreen);

    // Troca de dispositivos (Lógica simplificada)
    document.querySelector("#video-input").addEventListener('change', async (e) => {
        if(localStream) {
            // Reiniciar stream com nova constraint
            const newStream = await navigator.mediaDevices.getUserMedia({
                audio: true,
                video: { deviceId: { exact: e.target.value } }
            });
            localStream = newStream;
            showMyFeed();
        }
    });

    // --- START ---
    initSocket();
    getDevices(); // Popula os selects

</script>
</body>
</html>
