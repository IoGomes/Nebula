<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title></title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <link rel='stylesheet' type='text/css' media='screen' href='styles.css'>
</head>

<body>
    <div class="container row">
        <div class="buttons col-4">
            <button id="share" class="btn btn-primary d-block mb-1">Share my mic and camera</button>
            <button id="show-video" class="btn btn-secondary d-block mb-1">Show My Video</button>
            <button id="stop-video" class="btn btn-secondary d-block mb-1">Stop My Video</button>
            <div class="mb-1">
                <button id="change-size" class="btn btn-secondary mb-1">Change screen size</button>
                <input type="text" id="vid-width" value="1280" />
                <input type="text" id="vid-height" value="720" />
            </div>
            <div class="mb-1">
                <button id="start-record" class="btn btn-secondary mb-1">Start recording</button>
                <button id="stop-record" class="btn btn-secondary mb-1">Stop Recording</button>
                <button id="play-record" class="btn btn-secondary mb-1">Play Recording</button>
            </div>
            <button id="share-screen" class="btn btn-secondary d-block mb-1">Share Screen</button>
            <div>
                <label>Select audio input: </label>
                <select id="audio-input"></select>
            </div>
            <div>
                <label>Select audio output: </label>
                <select id="audio-output"></select>
            </div>
            <div>
                <label>Select video input: </label>
                <select id="video-input"></select>
            </div>



        </div>
        <div class="videos col-8">
            <div>
                <h3>My feed</h3>
                <video id="my-video" class="video" autoplay playsinline></video>
            </div>
            <div>
                <h3>Their feed</h3>
                <video id="other-video" class="video" autoplay playsinline></video>
            </div>
        </div>
    </div>

    <script>

        const videoEl = document.querySelector("#my-video");

        let stream = null;
        let mediaStream = null;
        const constraints = {
            audio: true,
            video: true
        }
        const getMicAndCamera = async (e) => {

            try {
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                console.log(stream)
                changeButtons([
                    'green', 'blue', 'blue', 'grey', 'grey', 'grey', 'grey', 'grey'
                ])
            } catch {
                console.log("Usuário negou o acesso aos dispositivos");
            }
        }

        const showMyFeed = (e) => {
            videoEl.srcObject = stream;
            changeButtons([
                'blue', 'grey', 'grey', 'blue', 'grey', 'grey', 'grey', 'grey'
            ])
        }

        const stopMyFeed = (e) => {
            const tracks = stream.getTracks();
            tracks.forEach(track => {
                track.stop()
            });
        }

        document.querySelector("#share").addEventListener('click', e => getMicAndCamera(e))
        document.querySelector("#show-video").addEventListener('click', e => showMyFeed(e))
        document.querySelector("#stop-video").addEventListener('click', e => stopMyFeed(e))
        document.querySelector("#start-record").addEventListener('click', e => startRecording(e))
        document.querySelector("#stop-record").addEventListener('click', e => stopRecording(e))
        document.querySelector("#play-record").addEventListener('click', e => playRecording(e))
        document.querySelector("#share-screen").addEventListener('click', e => shareScreen(e))

        document.querySelector("#audio-input").addEventListener('change', e => changeAudioInput(e))
        document.querySelector("#video-input").addEventListener('change', e => changeVideo(e))
        document.querySelector("#audio-output").addEventListener('change', e => changeAudioOutput(e))


        //green = btn-success
        //blue = btn-primary
        //grey = btn-secondary
        //red = btn-danger

        const buttonsById = [
            'share', 'show-video', 'stop-video', 'change-size', 'start-record',
            'stop-record', 'play-record', 'share-screen'
        ]

        //buttonEls will be an array of dom elements in order of buttonsById
        const buttonEls = buttonsById.map(buttonId => document.getElementById(buttonId));

        const changeButtons = (colorsArray) => {
            colorsArray.forEach((color, i) => {
                buttonEls[i].classList.remove('btn-success');
                buttonEls[i].classList.remove('btn-primary');
                buttonEls[i].classList.remove('btn-secondary');
                buttonEls[i].classList.remove('btn-danger');
                if (color === "green") {
                    buttonEls[i].classList.add('btn-success');
                } else if (color === "blue") {
                    buttonEls[i].classList.add('btn-primary');
                } else if (color === "grey") {
                    buttonEls[i].classList.add('btn-secondary');
                } else if (color === "red") {
                    buttonEls[i].classList.add('btn-danger');
                }
            })
        }

        const supportedConstraints = navigator.mediaDevices.getSupportedConstraints()

        const changeVideoSize = () => {
            stream.getVideoTracks().forEach(track => {

                const capabilities = track.getCapabilities()
                const height = document.querySelector("#vid-height").value
                const width = document.querySelector("#vid-width").value

                const vConstraints = {
                    height: { exact: height < capabilities.height.max ? height : capabilities.height.max },
                    width: { exact: width < capabilities.width.max ? width : capabilities.width.max },
                }

                track.applyConstraints(vConstraints)
            })
        }

        document.querySelector('#change-size').addEventListener('click', (e) => changeVideoSize(e));

        let mediaRecorder;
        let recordedBlobs;

        const startRecording = () => {
            if (!stream) {
                alert("No current feed");
                return
            }
            console.log("Start recording")
            recordedBlobs = [];
            mediaRecorder = new MediaRecorder(stream)
            mediaRecorder.ondataavailable = e => {

                console.log("Data is available for the media recorder!")
                recordedBlobs.push(e.data)
            }
            mediaRecorder.start();
            changeButtons([
                'green', 'green', 'blue', 'blue', 'green', 'blue', 'grey', 'blue'
            ])
        }


        const stopRecording = () => {
            if (!mediaRecorder) {
                alert("Please record before stopping!")
                return
            }
            console.log("stop recording")
            mediaRecorder.stop()
            changeButtons([
                'green', 'green', 'blue', 'blue', 'green', 'green', 'blue', 'blue'
            ])

        }

        const playRecording = () => {
            console.log("play recording")
            if (!recordedBlobs) {
                alert("No Recording saved")
                return
            }
            const superBuffer = new Blob(recordedBlobs)
            const recordedVideoEl = document.querySelector('#other-video');
            recordedVideoEl.src = window.URL.createObjectURL(superBuffer);
            recordedVideoEl.controls = true;
            recordedVideoEl.play();
            changeButtons([
                'green', 'green', 'blue', 'blue', 'green', 'green', 'green', 'blue'
            ])
        }

        const shareScreen = async () => {

            const options = {
                video: true,
                audio: false,
                surfaceSwitching: 'include'
            }
            try {
                mediaStream = await navigator.mediaDevices.getDisplayMedia(options);
                videoEl.srcObject = mediaStream;
            } catch (err) {
                console.log(err);
            }
            changeButtons([
                'green', 'green', 'blue', 'blue', 'green', 'green', 'green', 'green'
            ])
        }

        const audioInputEl = document.querySelector("#audio-input");
        const audioOutputEl = document.querySelector("#audio-output");
        const videoInputEl = document.querySelector("#video-input");


        const getDevices = async () => {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                console.log(devices);
                devices.forEach(d => {
                    const option = document.createElement('option');
                    option.value = d.deviceId
                    option.text = d.label
                    if (d.kind === "audioinput") audioInputEl.appendChild(option)
                    if (d.kind === "audiooutput") audioOutputEl.appendChild(option)
                    if (d.kind === "videoinput") videoInputEl.appendChild(option)
                })
            } catch (err) {
                console.log(err);
            }
        }

        const changeAudioInput = async (e) => {
            const deviceId = e.target.value;
            const newConstraints = {
                audio: { deviceId: { exact: deviceId } },
                video: true,
            }

            try {
                stream = await navigator.mediaDevices.getUserMedia(newConstraints);
                const tracks = stream.getAudioTracks();
                console.log(tracks)
            } catch (err) {
                console.log(err);
            }
        }

        const changeAudioOutput = async (e) => {
            await videoEl.setSinkId(e.target.value)
            console.log("Change audio device")
        }

        const changeVideo = async (e) => {
            const deviceId = e.target.value;
            const newConstraints = {
                audio: true,
                video: { deviceId: { exact: deviceId } }
            }

            try {
                stream = await navigator.mediaDevices.getUserMedia(newConstraints);
                const tracks = stream.getVideoTracks();
                console.log(tracks)
            } catch (err) {
                console.log(err);
            }
        }

        getDevices();
    </script>

</body>

</html>
