name: Push-to-EC2
on:
    push:
        branches:
            - main
jobs:
    deploy:
        name: Deploy to EC2
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the files
              uses: actions/checkout@v3

            - name: Copy files with SSH
              uses: easingthemes/ssh-deploy@main
              with:
                  SSH_PRIVATE_KEY: ${{ secrets.nebus.pem }}
                  REMOTE_HOST: ec2-18-223-149-106.us-east-2.compute.amazonaws.com
                  REMOTE_USER: ec2-user
                  SOURCE: "./"
                  TARGET: "/home/ec2-user"
                  EXCLUDE: ".gitignore,.github,.idea/"